name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Emit Pages deploy proof
        run: |
          python3 tooling/emit_pages_deploy_proof.py \
            --status passed \
            --reason github_pages_deploy_succeeded \
            --page-url "${{ steps.deployment.outputs.page_url }}" \
            --output artifacts/pages-deploy/pages-deploy-proof.json
          cat artifacts/pages-deploy/pages-deploy-proof.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Pages deploy proof
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: pages-deploy-proof
          path: artifacts/pages-deploy
          if-no-files-found: error
